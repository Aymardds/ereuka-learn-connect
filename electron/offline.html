<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurêka - Connexion requise</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f291e 0%, #1a4433 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .logo-container svg {
      width: 48px;
      height: 48px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="44" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6"/>
        <path d="M30 75V25H65V35H42V45H60V55H42V65H65V75H30Z" fill="#f59e0b"/>
      </svg>
    </div>
    <h1>Connexion serveur interrompue</h1>
    <p>Impossible de joindre la plateforme Eurêka ERP. Vérifiez votre connexion internet ou réessayez dans quelques instants.</p>
    <button class="btn" id="retry-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      Réessayer la connexion
    </button>
    <div class="footer">
      Eurêka ERP Scolaire & Universitaire &bull; inexiumus.com
    </div>
  </div>

  <script>
    document.getElementById('retry-btn').addEventListener('click', () => {
      const btn = document.getElementById('retry-btn');
      btn.innerText = 'Connexion en cours...';
      btn.disabled = true;
      if (window.electronAPI && window.electronAPI.retryConnection) {
        window.electronAPI.retryConnection();
      } else {
        window.location.reload();
      }
    });

    window.addEventListener('online', () => {
      if (window.electronAPI && window.electronAPI.retryConnection) {
        window.electronAPI.retryConnection();
      } else {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
